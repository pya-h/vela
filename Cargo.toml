[package]
name = "vela"
version = "0.1.0"
edition = "2024"

[dependencies]

[lints]
workspace = true

# The compiler (this package) has no dependencies. Vela Studio's crates live
# under ide/; plain `cargo build` and `cargo test` still cover only the
# compiler, and `--workspace` includes the IDE.
[workspace]
members = [".", "ide/analysis"]
default-members = ["."]
resolver = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
