[package]
name = "vela"
version = "0.1.0"
edition = "2024"
authors = ["pya-h <thcplusplus@gmail.com>"]
# Let chains (`if let … && …`), used across the workspace, need Rust 1.88.
rust-version = "1.88"
description = "A small systems language with a compiler to C11"

[dependencies]

[lints]
workspace = true

# The compiler (this package) has no dependencies. Vela Studio's crates live
# under ide/; plain `cargo build` and `cargo test` still cover only the
# compiler, and `--workspace` includes the IDE.
[workspace]
members = [".", "ide/analysis", "ide/wasm", "ide/server"]
default-members = ["."]
resolver = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

# The editor's WebAssembly module: small and fast to load.
[profile.release.package.vela-analysis-wasm]
opt-level = "s"
