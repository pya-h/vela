[package]
name = "vela-lsp"
version = "0.1.0"
edition = "2024"
description = "Language Server Protocol daemon for Vela (IntelliSense, diagnostics, completion, hover, outline, and semantic tokens)"
publish = false

[[bin]]
name = "vela-lsp"
path = "src/main.rs"

[dependencies]
vela = { path = "../.." }
vela-analysis = { path = "../analysis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
